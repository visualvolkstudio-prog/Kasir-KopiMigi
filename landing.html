<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kopi Migi</title>
  <meta name="theme-color" content="#f5c800" />
  <link rel="icon" href="/assets/favicon-migi.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #f5c800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", system-ui, sans-serif;
    }

    /* ── TICKER WRAPPER ── */
    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      /* slight diagonal tilt like the reference */
      transform: rotate(-4deg) scaleX(1.05);
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: scroll 12s linear infinite;
      /* pause on hover */
    }

    .ticker-track:hover { animation-play-state: paused; }

    /* One "row" of text — duplicate for seamless loop */
    .ticker-row {
      display: flex;
      align-items: center;
      gap: 0;
      white-space: nowrap;
      padding: 1.25rem 0;
    }

    .ticker-item {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -.01em;
      color: #0a0c14;
      padding: 0 1.5rem;
      line-height: 1;
    }

    .ticker-dot {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: #0a0c14;
      opacity: .35;
      flex-shrink: 0;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── LOGO OVERLAY (centered, subtle) ── */
    .logo-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      gap: .75rem;
      z-index: 10;
    }

    .logo-img {
      width: clamp(48px, 8vw, 80px);
      height: clamp(48px, 8vw, 80px);
      object-fit: contain;
      mix-blend-mode: multiply;
      opacity: .85;
    }

    .logo-name {
      font-size: clamp(.875rem, 2vw, 1.125rem);
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #0a0c14;
      opacity: .5;
    }
  </style>
</head>
<body>

  <!-- LOGO (centered, above ticker) -->
  <div class="logo-wrap" aria-label="Kopi Migi">
    <img class="logo-img" src="/assets/logo-miginew-transparent.png" alt="Kopi Migi" width="80" height="80" />
    <span class="logo-name">Kopi Migi</span>
  </div>

  <!-- TICKER -->
  <div class="ticker-wrap" role="marquee" aria-label="Sedang dalam pembuatan">
    <div class="ticker-track">
      <!-- Set A -->
      <div class="ticker-row">
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot" aria-hidden="true">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot" aria-hidden="true">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot" aria-hidden="true">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot" aria-hidden="true">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot" aria-hidden="true">◆</span>
      </div>
      <!-- Set B (duplicate for seamless loop) -->
      <div class="ticker-row" aria-hidden="true">
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot">◆</span>
        <span class="ticker-item">Sedang Dalam Pembuatan</span>
        <span class="ticker-dot">◆</span>
      </div>
    </div>
  </div>

</body>
</html>
