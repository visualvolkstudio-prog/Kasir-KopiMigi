<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kopi Migi</title>
    <meta name="description" content="Kedai kopi favorit kamu. Nikmati setiap tegukan bersama Kopi Migi." />
    <meta name="theme-color" content="#00349b" />
    <link rel="icon" href="/assets/favicon-migi.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --blue:    #00349b;
        --cream:   #faf8ff;
        --text:    #0f1117;
        --muted:   #5c6070;
        --border:  #e2e2ec;
      }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--cream);
        color: var(--text);
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 20px;
        max-width: 400px;
        width: 100%;
        padding: 2.5rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 4px 24px 0 rgba(0,52,155,.07);
      }
      .logo { width: 64px; height: 64px; object-fit: contain; margin-bottom: 1rem; }
      .brand-name { font-size: 1.5rem; font-weight: 700; color: var(--blue); letter-spacing: -.02em; margin-bottom: .25rem; }
      .tagline { font-size: .9375rem; color: var(--muted); text-align: center; margin-bottom: 1.75rem; }
      .divider { width: 100%; height: 1px; background: var(--border); margin-bottom: 1.5rem; }
      .info-list { width: 100%; display: flex; flex-direction: column; gap: .875rem; margin-bottom: 1.75rem; list-style: none; }
      .info-row { display: flex; align-items: flex-start; gap: .75rem; }
      .info-icon { width: 36px; height: 36px; border-radius: 10px; background: #eef2ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
      .info-text { display: flex; flex-direction: column; gap: .125rem; }
      .info-label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .info-value { font-size: .9375rem; color: var(--text); line-height: 1.4; }
      .socials { width: 100%; display: flex; gap: .625rem; }
      .social-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .625rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: #fff; color: var(--text); font-family: inherit; font-size: .875rem; font-weight: 500; text-decoration: none; transition: background .15s, border-color .15s; }
      .social-btn:hover { background: #f3f4f8; border-color: #c5c8d8; }
      .social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
      footer { margin-top: 1.5rem; font-size: .8125rem; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/assets/logo-miginew-transparent.png" alt="Logo Kopi Migi" />
      <p class="brand-name">Kopi Migi</p>
      <p class="tagline">Nikmati setiap tegukan,<br>temukan momen terbaikmu.</p>
      <div class="divider"></div>
      <ul class="info-list" role="list">
        <li class="info-row">
          <span class="info-icon" aria-hidden="true">🕙</span>
          <div class="info-text">
            <span class="info-label">Jam Buka</span>
            <span class="info-value">10:00 – 23:00 (setiap hari)</span>
          </div>
        </li>
        <li class="info-row">
          <span class="info-icon" aria-hidden="true">📍</span>
          <div class="info-text">
            <span class="info-label">Lokasi</span>
            <span class="info-value">Garut, Jawa Barat, Indonesia</span>
          </div>
        </li>
      </ul>
      <div class="socials">
        <a class="social-btn" href="https://instagram.com/kopimigi" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/></svg>
          Instagram
        </a>

    </div>

  </body>
</html>
