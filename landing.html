<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kopi Migi</title>
  <meta name="theme-color" content="#00349b" />
  <link rel="icon" href="/assets/favicon-migi.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/landing.css" />
</head>
<body>

  <!-- YELLOW TAPE BAND — diagonal, white text scrolling inside -->
  <div class="tape" role="marquee" aria-label="Sedang dalam pembuatan">
    <div class="tape-track">
      <!-- Set A -->
      <div class="tape-row">
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot" aria-hidden="true">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot" aria-hidden="true">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot" aria-hidden="true">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot" aria-hidden="true">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot" aria-hidden="true">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot" aria-hidden="true">◆</span>
      </div>
      <!-- Set B (duplicate for seamless loop) -->
      <div class="tape-row" aria-hidden="true">
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot">◆</span>
        <span class="tape-item">Sedang Dalam Pembuatan</span>
        <span class="tape-dot">◆</span>
      </div>
    </div>
  </div>

</body>
</html>
